spring.application.name=LoomisLMS-Backend

# ??????????? ? ?????????? ? ?????? ??????
## 1) PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/loomislms_db
spring.datasource.username=loomis_superUser
spring.datasource.password=loomis_password
spring.datasource.driver-class-name=org.postgresql.Driver

### JPA ?????????
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

## 2) MongoDB
spring.mongodb.uri=mongodb://mongo_user:mongo_password@localhost:27017/loomislms_content?authSource=admin

## 3) Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

### TTL ?????
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

