version: '3.8'

services:
  # 1. Основная реляционная БД
  postgres:
    image: postgres:16-alpine
    container_name: loomislms-postgres
    environment:
      POSTGRES_DB: loomislms_db
      POSTGRES_USER: loomis_superUser
      POSTGRES_PASSWORD: loomis_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomis_user -d loomislms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Нереляционная БД
  mongodb:
    image: mongo:7.0
    container_name: loomislms-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
      MONGO_INITDB_DATABASE: loomislms_content
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 3. Кэширование и токены
  redis:
    image: redis:7-alpine
    container_name: loomislms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 4. Сервер аутентификации Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: loomislms-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_HTTP_PORT: 8080
    ports:
      - "8081:8080" # Вынесен на 8081, чтобы не конфликтовать со Spring Boot (8080)
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  redis_data: